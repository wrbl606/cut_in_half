  - id: task_002
    title: Fix Ready button on web so finishing a level advances to the result screen
    description: "On the web build, pressing the Ready button on the Cut screen only
      plays the button press animation and never navigates to the ResultScreen.
      Root cause: _finish() in lib/screens/cut_screen.dart calls
      StorageService.save() and AttemptStore.record(). Both services persist via
      dart:io File plus path_provider's getApplicationSupportDirectory(),
      neither of which is supported on Flutter Web. StorageService.load()
      swallows errors and returns fresh state, but StorageService.save() has no
      try/catch and throws an UnsupportedError on web. That exception escapes
      _finish() before Navigator.of(context).pushReplacement(...ResultScreen)
      runs, so the result screen never appears. Fix so completing a level on web
      persists progress with a web-compatible store (e.g. shared_preferences, or
      conditional exports that swap dart:io for a web-safe implementation) and
      reliably advances to the ResultScreen. Keep mobile/desktop file-based
      persistence working."
    source_links: []
    status: backlog
    priority: P1
    labels:
      - bug
      - web
    repo_targets: []
    acceptance_criteria:
      - On the web build, after making the required cuts and pressing Ready, the
        app advances to the ResultScreen showing the level result
      - Player progress (best score/accuracy) persists across web app reloads
      - Attempt history is recorded on web and survives reloads (or degrades
        gracefully with documented rationale if intentionally skipped)
      - "iOS and macOS behavior is unchanged: existing file-based persistence
        still works"
      - flutter analyze is clean and both web and mobile builds compile without
        errors
