  - id: task_001
    title: Show sound toggle on main menu screen
    description: Make the sound on/off control directly visible on the main menu
      screen so players can mute or unmute without navigating into the separate
      Settings screen. Currently the toggle lives only in SettingsScreen as
      local state and is not persisted, so it resets on every app launch. Move
      (or mirror) the control onto the menu screen, e.g. as a small icon/switch
      in the top corner of the SafeArea. Persist the setting so the chosen state
      survives restarts. Keep the Settings screen working or remove it if the
      menu control fully replaces it.
