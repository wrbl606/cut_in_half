version = 1

[agent]
tool           = "opencode"
prompt_file    = "prompts/task.md"
max_iterations = 3
llm_env           = "OPENCODE_API_KEY"
llm_credential_id = "OPENCODE_GO_SUBSCRIPTION_KEY"
command        = ["opencode", "run", "--model", "opencode-go/deepseek-v4.1-flash", "{{prompt}}"]

[setup]
script = "setup.sh"

[verify]
script = "verify.sh"

[pr]
branch_prefix = "fleet/"
base          = "main"
title         = "{{issue.key}}: {{issue.summary}}"
labels        = ["agent"]
body_file     = "pr-template.md"

[platform]
os   = "linux"
arch = "amd64"

[coi]
# Flutter-enabled COI image (profile built with `coi build --profile fleet-flutter`).
profile = "fleet-flutter"
network = "allowlist"
timeout = "45m"

# Flutter/pub downloads in addition to the registry allowlist.
allowed_domains = [
  "pub.dev",
  "pub.dartlang.org",
  "storage.googleapis.com",
  "dl.google.com",
  "github.com",
  "codeload.github.com",
  "objects.githubusercontent.com",
  "raw.githubusercontent.com",
]
