version = 1

[agent]
tool           = "opencode"
prompt_file    = "prompts/task.md"
max_iterations = 3
llm_env        = "OPENCODE_GO_SUBSCRIPTION_KEY"

[setup]
script = "setup.sh"

[verify]
script = "verify.sh"

[pr]
branch_prefix = "fleet/"
base          = "main"
title         = "{{issue.key}}: {{issue.summary}}"
labels        = ["agent"]
body_file     = "pr-template.md"

[platform]
os   = "linux"
arch = "amd64"

[coi]
profile = ""
network = "allowlist"
timeout = "45m"

# Flutter/pub downloads in addition to the registry allowlist.
allowed_domains = [
  "pub.dev",
  "pub.dartlang.org",
  "storage.googleapis.com",
  "dl.google.com",
  "github.com",
  "codeload.github.com",
  "objects.githubusercontent.com",
  "raw.githubusercontent.com",
]
